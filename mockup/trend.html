<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트렌드·사업성 분석 시안</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* 색·모서리는 tokens.css(원본)를 쓴다. 아래는 이 파일 안에서 쓰는 짧은 이름 → 토큰 연결뿐. */
:root{
  color-scheme: light;
  --accent:var(--ic-accent); --accent-strong:var(--ic-accent-strong); --on-accent:var(--ic-on-accent-strong);
  --accent-muted:var(--ic-highlight-bg); --accent-ink:var(--ic-highlight-text); --link:var(--ic-link);
  --bg:var(--ic-bg); --surface:var(--ic-surface); --muted:var(--ic-surface-muted);
  --ink:var(--ic-text); --ink2:var(--ic-text-2); --ink3:var(--ic-text-3);
  --line:var(--ic-border); --line2:var(--ic-border-strong);
  --warn:var(--ic-warning-text); --warn-bg:var(--ic-warning-bg); --bad:var(--ic-error-text); --bad-bg:var(--ic-error-bg);
  --ok:var(--ic-success-text); --ok-bg:var(--ic-success-bg);
  /* 검토용 바깥 화면(폰 밖)만 쓰는 값 */
  --page:#F4F5F7; --phone-frame:#1F2937; --shadow:0 10px 30px rgba(0,0,0,.10);
}
:root[data-theme="dark"]{
  --page:#0E0F11; --phone-frame:#2A2D33; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0}
header.top .meta{color:var(--ink2);font-size:12px}
header.top .sp{flex:1}
.hbtn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px}
.layout{display:grid;grid-template-columns:240px 1fr 340px;height:calc(100vh - 49px)}
nav#map{overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:10px}
nav#map h3{font-size:11px;color:var(--ink3);margin:14px 6px 4px;font-weight:600}
nav#map a{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px;cursor:pointer}
nav#map a:hover{background:var(--muted)}
nav#map a.on{background:var(--accent-muted);color:var(--accent-ink);font-weight:600}
nav#map a .id{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink3);min-width:46px}
nav#map a.on .id{color:inherit}
main{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px}
aside#info{overflow:auto;border-left:1px solid var(--line);background:var(--surface);padding:14px 16px}
aside#info h2{font-size:16px;margin:4px 0 2px}
aside#info .sid{font-family:ui-monospace,Consolas,monospace;color:var(--ink3);font-size:12px}
aside#info h4{font-size:12px;color:var(--ink3);margin:14px 0 4px}
aside#info ul{margin:0;padding-left:18px} aside#info li{margin:2px 0}
.states{display:flex;flex-wrap:wrap;gap:4px}
.states button{border:1px solid var(--line2);background:var(--muted);border-radius:999px;padding:2px 10px;font-size:12px}
.states button.on{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.cost0{color:var(--ok);font-weight:600} .costy{color:var(--warn);font-weight:600}

/* phone */
.phone{width:390px;height:800px;background:var(--bg);border:10px solid var(--phone-frame);border-radius:38px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:var(--shadow);flex:none}
.status{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:var(--ink2);flex:none}
.appbar{display:flex;align-items:center;gap:8px;padding:6px 14px;flex:none;min-height:48px}
.appbar .t{font-weight:700;font-size:22px;flex:1;letter-spacing:-.01em}
.appbar .t.sm{font-size:16px}
.ib{border:none;background:none;padding:4px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.ib:hover{background:var(--muted)}
.ib svg{width:24px;height:24px}
.scr{flex:1;overflow:auto;padding:4px 14px 20px}
.tabs{display:flex;border-top:1px solid var(--line);flex:none;background:var(--bg);padding:2px 0 6px}
.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--ic-touch);padding:4px 0;color:var(--ink2);font-size:var(--ic-size-tab);font-weight:500;line-height:1.2}
.tabs svg{width:24px;height:24px}
.seg{display:flex;gap:6px;margin:2px 0 12px}
.seg button{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent-muted);color:var(--accent-ink);border-color:transparent}
.weekbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px}
.weekbar b{font-size:14px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;margin-bottom:10px}
.box.soft{background:var(--muted);border-color:transparent}
.box.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.box.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.box.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.box.info{background:var(--accent-muted);border-color:transparent;color:var(--accent-ink)}
.sec{font-size:13px;font-weight:700;margin:16px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.sec span{font-weight:400;font-size:12px;color:var(--ink3)}
.muted{color:var(--ink2)} .small{font-size:12px} .tiny{font-size:11px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:8px} .sb{justify-content:space-between} .grow{flex:1;min-width:0}
.theme{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.theme:last-child{border-bottom:none}
.theme .nm{font-weight:600;font-size:14px;line-height:1.3}
.theme .mt{font-size:11.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme .gr{font-weight:700;font-size:13px;text-align:right;min-width:52px}
.up{color:var(--ok)} .down{color:var(--bad)}
.ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.ck.on{background:var(--accent);border-color:var(--accent)}
.mark{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-muted);border-radius:5px;padding:0 6px;margin-left:4px;vertical-align:1px}
.hot{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:0 6px;margin-left:4px;vertical-align:1px}
.tok{display:inline-block;font-size:11px;border-radius:5px;padding:1px 7px;background:var(--muted);color:var(--ink2);margin:0 4px 4px 0;white-space:nowrap}
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.btn.pri{background:var(--accent-strong);color:var(--on-accent);border-color:var(--accent-strong)}
.btn.full{width:100%}
.btn.dis{opacity:.45;cursor:not-allowed}
.fab{position:absolute;left:14px;right:14px;bottom:74px;z-index:3}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:none}
.chev{color:var(--ink3)}
.score{font-weight:800;font-size:18px;min-width:40px;font-variant-numeric:tabular-nums}
.score.hi{color:var(--link)}
.bar{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.low i{background:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tbl th{color:var(--ink3);font-weight:600}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.sig{border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--muted);font-size:12.5px}
.sig .src{color:var(--ink3);font-size:11px}
.blk{border-top:1px solid var(--line);padding:12px 0}
.blk .bt{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:10px 16px 22px;max-height:88%;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.toggle.on::after{left:18px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.radio.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.radio .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;margin-top:1px}
.radio.on .dot{border:5px solid var(--accent)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.step .c{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.5px solid var(--line2);color:var(--ink3)}
.step.done .c{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.step.now .c{border-color:var(--accent);color:var(--accent)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--muted);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:18px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.bubble{border-radius:14px;padding:9px 12px;margin:8px 0;max-width:86%;font-size:13px}
.bubble.me{background:var(--accent-strong);color:var(--on-accent);margin-left:auto;border-bottom-right-radius:4px}
.bubble.ai{background:var(--muted);border-bottom-left-radius:4px}
.inputbar{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);flex:none}
.inputbar .in{flex:1;border:1px solid var(--line2);border-radius:20px;padding:8px 14px;color:var(--ink3);font-size:13px}
.respbar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line);flex:none;background:var(--bg)}
.respbar .btn{padding:8px 0;font-size:12.5px}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12.5px;margin:0 6px 8px 0;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#262626;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;z-index:6;white-space:nowrap}

/* doc / mail / noti */
.doc{max-width:860px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 28px}
.doc h2{margin:0 0 4px;font-size:22px}
.doc h3{font-size:15px;margin:22px 0 8px}
.doc p{margin:6px 0;color:var(--ink2)}
.doc table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.doc th{color:var(--ink3);font-weight:600}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:8px 0}
.flow .n{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--surface);min-width:118px;flex:1}
.flow .n b{display:block;font-size:13px}
.flow .n.pay{border-color:var(--warn);background:var(--warn-bg)}
.flow .n.free{border-color:var(--ok);background:var(--ok-bg)}
.flow .ar{display:flex;align-items:center;color:var(--ink3)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.layers .l{border:1px solid var(--line);border-radius:10px;padding:12px}
.layers .l b{display:block;margin-bottom:4px}
.ia{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--muted);border-radius:10px;padding:12px 14px;white-space:pre;overflow:auto;line-height:1.6}
.mail{width:620px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail .mh{padding:12px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
.mail .mh b{color:var(--ink);font-size:15px;display:block;margin-top:2px}
.mail .mb{padding:18px 22px}
.mail .mb h4{margin:18px 0 6px;font-size:14px}
.mail .cta{display:inline-block;background:var(--accent-strong);color:var(--on-accent);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none}
.noti{width:390px}
.noti .n{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer}
@media (max-width:1180px){.layout{grid-template-columns:200px 1fr}aside#info{display:none}}
@media (max-width:760px){.layout{grid-template-columns:1fr;height:auto}nav#map{display:none}main{padding:12px 0}.phone{transform:scale(.92);transform-origin:top center}}
</style>
</head>

  'SC-21':{p:'추론 high는 오래 걸리므로 진행 단계를 보여 준다.',d:['5단계 진행(코드 단계/LLM 단계 구분)','지금까지 비용','나가도 계속, 완료 알림'],next:['SC-22'],cost:'진행 중'},
  'SC-22':{p:'결론 먼저, 그다음 점수 순 목록.',d:['맨 위 판단 칸: 의뢰(초록) / 사업성 미달(주황 + 이유 + 다시 볼 조건)','검토 분야 한 줄: 점수·이름·가장 약한 항목 또는 관문 탈락','의뢰 분야 → 의뢰서, 나머지 → 간단 보기'],next:['SC-23','SC-24'],cost:'0원 (저장분)',states:['의뢰 1건','사업성 미달']},
  'SC-23':{p:'낮은 분야를 필요할 때만 짧게 본다.',d:['평가표 6항목 막대 + 한 줄 근거','관문 결과, 무엇이 바뀌면 의뢰 가능한가','근거 링크','추가 질문(비용) / 지켜보기'],next:['SC-26'],cost:'0원 (추가 질문만 비용)'},
  'SC-24':{p:'의뢰인이 나에게 보내는 문서.',d:['사업성 점수 요약','배경·고객·반대 검토·MVP·기술·수익화·검증·일정·완료 기준·위험','근거 원문','하단 응답 4버튼'],next:['SC-25','SC-26'],cost:'0원'},
  'SC-25':{p:'응답은 다음 분석과 추적으로 이어진다.',d:['수락: 추적 등록·리포트 칸 생성 안내','거절: 이유 칩(다음 분석 피드백)','보류: 4주 뒤 다시'],cost:'0원',states:['수락','거절','보류']},
  'SC-26':{p:'의뢰서·심사 기록을 맥락으로 묻는다.',d:['맥락 표시','답마다 비용·근거·AI 판단 꼬리표','근거 없으면 "판단 보류"'],cost:'질문당 ≈$0.02~0.05'},
  'SC-27':{p:'지난 분석과 진행 중 의뢰를 모아 본다.',d:['진행 중 의뢰 카드(관련 글 수)','지난 분석: 날짜·대상·결과·응답·비용','이번 달 사용량'],cost:'0원'},
  'SC-28':{p:'리포트와 분석 비용을 스스로 조절.',d:['리포트 일정·메일·◆ 기준·AI 주제 묶기','모델·추론 강도·반대 검토·기준점·상한','평가표 가중치'],cost:'0원'},
  'N-02':{p:'짧게 알리고 해당 화면으로 보낸다.',d:['주간 리포트 도착','분석 완료(의뢰 / 미달)','예산 80% 경고']},
  'M-02':{p:'앱을 안 열어도 이번 주 흐름을 읽을 수 있게.',d:['요약 3줄, 뜨는·지는 테마 표, 저장소 표, 진행 중 의뢰','분석 요청은 앱으로 연결'],cost:'0원'},
  'M-03':{p:'분석 결과를 기록으로 남긴다.',d:['판단(의뢰/미달)','검토 분야 점수 순','의뢰서 요약 → 앱에서 응답'],cost:'0원'},
};
const defaults = {'SC-17':'테마 선택','SC-20':'선택 테마','SC-22':'의뢰 1건','SC-25':'수락'};

function nav(){
  let g='', h='';
  for (const s of screens){ if (s.g!==g){ g=s.g; h+=`<h3>${g}</h3>`; } h+=`<a data-go="${s.id}" class="${s.id===cur?'on':''}"><span class="id">${s.id}</span>${s.name}</a>`; }
  document.getElementById('map').innerHTML = h;
}
function side(){
  const s = screens.find(x=>x.id===cur), i = info[cur]||{};
  document.getElementById('info').innerHTML = `<div class="sid">${cur}</div><h2>${s.name}</h2>
  <h4>목적</h4><div>${i.p||''}</div>
  ${i.d?`<h4>전달하는 정보</h4><ul>${i.d.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
  ${i.states?`<h4>상태</h4><div class="states">${i.states.map(x=>`<button data-st-only="${x}" class="${(st[cur]||defaults[cur])===x?'on':''}">${x}</button>`).join('')}</div>`:''}
  ${i.next?`<h4>다음 화면</h4><div class="small">${i.next.join(' · ')}</div>`:''}
  ${i.cost?`<h4>비용</h4><div class="${i.cost.startsWith('0')?'cost0':'costy'}">${i.cost}</div>`:''}
  ${i.q?`<h4>검토 포인트</h4><ul>${i.q.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
  <h4>안내</h4><div class="small muted">데이터·비용은 가상 샘플입니다. sol 단가 확인 전이라 비용은 예시입니다.</div>`;
}
function render(){
  if (!st[cur] && defaults[cur]) st[cur] = defaults[cur];
  document.getElementById('stage').innerHTML = S[cur]();
  nav(); side();
}
document.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick){ e.stopPropagation(); const id = pick.dataset.pick; sel.has(id)?sel.delete(id):(sel.size<3&&sel.add(id)); render(); return; }
  const only = e.target.closest('[data-st-only]');
  if (only){ st[cur] = only.dataset.stOnly; render(); return; }
  const go = e.target.closest('[data-go]');
  if (go){ cur = go.dataset.go; if (go.dataset.st) st[cur] = go.dataset.st; render(); document.getElementById('stage').scrollTop = 0; }
});
const tb = document.getElementById('themeBtn');
tb.onclick = () => { const d = document.documentElement.dataset.theme==='dark'; document.documentElement.dataset.theme = d?'light':'dark'; tb.textContent = d?'다크 모드':'라이트 모드'; };
render();
</script>
</body>
</html>
