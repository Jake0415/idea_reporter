<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 아이디어 수집기 — 와이어프레임</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#d1d5db; --line2:#e5e7eb; --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af;
  --box:#f9fafb; --accent:#2563eb; --accent-soft:#dbeafe; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --ok:#047857; --ok-soft:#d1fae5; --l:#7c3aed; --l-soft:#ede9fe;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button{font:inherit;cursor:pointer}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0}
header.top .meta{color:var(--ink2);font-size:12px}
header.top .sp{flex:1}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--box);color:var(--ink2);white-space:nowrap}
.pill.mvp{background:var(--accent-soft);border-color:#bfdbfe;color:#1e40af}
.pill.l{background:var(--l-soft);border-color:#ddd6fe;color:var(--l)}
.pill.new{background:var(--warn-soft);border-color:#fde68a;color:var(--warn)}
.layout{display:grid;grid-template-columns:250px 1fr 360px;gap:0;height:calc(100vh - 49px)}
nav#map{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px}
nav#map h3{font-size:11px;color:var(--ink3);margin:14px 6px 4px;text-transform:none;letter-spacing:.02em}
nav#map a{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13px}
nav#map a:hover{background:var(--box)}
nav#map a.on{background:var(--accent-soft);color:#1e3a8a;font-weight:600}
nav#map a .id{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink3);min-width:44px}
nav#map a .dot{width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-left:auto;display:none}
nav#map a.noted .dot{display:block}
main{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px}
.phone{width:390px;height:800px;background:var(--panel);border:10px solid #1f2937;border-radius:36px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.status{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;color:var(--ink2);flex:none}
.appbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line2);flex:none;min-height:46px}
.appbar .t{font-weight:700;font-size:16px;flex:1}
.appbar .back{border:none;background:none;font-size:20px;padding:0 4px;color:var(--ink)}
.appbar .act{border:1px solid var(--line);background:var(--box);border-radius:8px;padding:3px 9px;font-size:12px}
.scr{flex:1;overflow:auto;padding:12px 14px 20px}
.tabs{display:flex;border-top:1px solid var(--line);flex:none;background:var(--panel)}
.tabs button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:11px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ic{width:22px;height:22px;border:2px solid currentColor;border-radius:6px}
.tabs button.on{color:var(--accent);font-weight:700}
.box{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px;margin-bottom:10px}
.box.soft{background:var(--box)}
.box.warn{background:var(--warn-soft);border-color:#fcd34d;color:#78350f}
.box.bad{background:var(--bad-soft);border-color:#fca5a5;color:#7f1d1d}
.box.ok{background:var(--ok-soft);border-color:#6ee7b7;color:#064e3b}
.box.info{background:var(--accent-soft);border-color:#93c5fd;color:#1e3a8a}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.muted{color:var(--ink2)} .small{font-size:12px} .tiny{font-size:11px;color:var(--ink3)}
.h{font-weight:700;font-size:15px;margin:2px 0 4px}
.sec{font-size:12px;color:var(--ink3);margin:16px 2px 6px;font-weight:600}
.funnel{display:flex;align-items:center;gap:4px;font-size:12px;flex-wrap:wrap}
.funnel b{font-size:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--panel);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .title{font-weight:700;font-size:14px;line-height:1.35}
.card .one{color:var(--ink2);font-size:12px;margin:3px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--box);color:var(--ink2);white-space:nowrap}
.chip.cat{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.chip.badge{background:var(--warn-soft);border-color:#fde68a;color:var(--warn)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.star{border:none;background:none;font-size:18px;color:var(--ink3);padding:0 2px;line-height:1}
.star.on{color:#f59e0b}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.full{width:100%}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel);font:inherit;color:var(--ink)}
.input.ph{color:var(--ink3)}
.list .li{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.list .li:last-child{border-bottom:none}
.list .li .grow{flex:1;min-width:0}
.list .li .chev{color:var(--ink3)}
.blk{border-top:1px solid var(--line2);padding:10px 0}
.blk .bt{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.sig{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;margin:6px 0;background:var(--box);font-size:12px}
.sig .src{color:var(--ink3);font-size:11px}
.quote{border-left:3px solid var(--line);padding-left:8px;margin:4px 0;color:var(--ink2);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--accent)}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.toggle.on::after{left:18px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td,.tbl th{border-bottom:1px solid var(--line2);padding:5px 4px;text-align:left}
.tbl th{color:var(--ink3);font-weight:600}
.sheet-bg{position:absolute;inset:0;background:rgba(17,24,39,.35);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--panel);width:100%;border-radius:16px 16px 0 0;padding:14px 16px 20px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;display:flex;gap:12px;align-items:center;z-index:6;white-space:nowrap}
.toast u{color:#93c5fd;cursor:pointer;text-decoration:none}
.ph-img{border:1px dashed var(--line);border-radius:8px;height:60px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f3f4f6 6px,#f3f4f6 12px)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
aside#info{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px}
aside#info h2{font-size:16px;margin:4px 0 2px}
aside#info .sid{font-family:ui-monospace,Consolas,monospace;color:var(--ink3);font-size:12px}
aside#info h4{font-size:12px;color:var(--ink3);margin:14px 0 4px}
aside#info ul{margin:0;padding-left:18px}
aside#info li{margin:2px 0}
aside#info .states{display:flex;flex-wrap:wrap;gap:4px}
aside#info .states button{border:1px solid var(--line);background:var(--box);border-radius:999px;padding:2px 9px;font-size:12px}
aside#info .states button.on{background:var(--accent);border-color:var(--accent);color:#fff}
aside#info textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;resize:vertical}
aside#info .q{background:var(--warn-soft);border:1px solid #fde68a;border-radius:8px;padding:6px 9px;font-size:12px;color:#78350f;margin:4px 0}
aside#info code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--box);padding:0 3px;border-radius:3px}
aside#info .navs a{color:var(--accent);cursor:pointer;margin-right:8px;font-size:12px}
.mail{width:600px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden}
.mail .mh{padding:12px 16px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.mail .mb{padding:16px 20px}
.noti{width:390px}
.noti .n{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
@media (max-width:1100px){.layout{grid-template-columns:200px 1fr}aside#info{display:none}}
</style>
</head>
<body>
<header class="top">
  <h1>AI 아이디어 수집기 — 와이어프레임 v1</h1>
  <span class="meta">화면 안의 버튼·탭·카드를 눌러 이동 · 오른쪽 패널에서 상태 전환·검토 메모</span>
  <span class="sp"></span>
  <span class="pill mvp">MVP</span><span class="pill l">나중(L)</span><span class="pill new">이번에 새로 정의</span>
  <button class="btn" id="exportNotes">검토 메모 복사</button>
</header>
<div class="layout">
  <nav id="map"></nav>
  <main id="stage"></main>
  <aside id="info"></aside>
</div>

  return `<div class="card fade" style="animation-delay:${i*60}ms;${ni?"opacity:.5":""}" data-nav="SC-02" data-card="${c.id}">
    <div class="row sb" style="align-items:flex-start"><div class="title">${i+1}. ${esc(c.title)}</div>
    <button class="star ${state.stars[c.id]?"on":""}" data-star="${c.id}" aria-label="관심">★</button></div>
    <div class="one">${esc(c.one)}</div>
    <div class="chips">${chipCat(c.cat)}${badges(c)}<span class="chip">AI ${c.score}</span>${ni?`<span class="chip">관심 없음</span>`:""}</div></div>`;
}
function sheetHtml(){

  if(state.sheet==="rerun"){

  <div class="tiny" style="margin-top:6px">인용 검증: 근거 1개 제거(수집 목록에 없는 URL) · 비용은 가격표 기준 추정</div></div>`,"settings");
R["SC-11"] = s => {
  if(s==="키 등록 시트" && !state.sheet) state.sheet="key";
  const claudeBad = s==="키 확인 실패"; const openai = s!=="Claude만";
  const prov = (n,st,last4,models)=>`<div class="box"><div class="row sb"><b>${n}</b>${st==="ok"?`<span class="chip" style="color:var(--ok)">연결됨 ··· ${last4}</span>`:st==="bad"?`<span class="chip" style="color:var(--bad)">확인 실패</span>`:`<span class="chip">없음</span>`}</div>
    <div class="tiny">${st==="ok"?`모델 ${models}개 · 마지막 확인 07:03`:st==="bad"?"인증 실패 — 키가 만료되었거나 폐기됨":"키를 등록하면 연동됩니다"}</div>
    <div class="row" style="margin-top:6px">${st==="none"?`<button class="btn small" data-sheet="key">키 등록</button>`:`<button class="btn small" data-sheet="key">교체</button><button class="btn small" data-toast="다시 확인했습니다">다시 확인</button><button class="btn small ghost">삭제</button>`}</div></div>`;
  return phone(appbar("AI 공급자·모델",{back:"SC-06"})+`<div class="scr">
    <div class="sec" style="margin-top:0">공급자 키 — 하나 이상 필요</div>
    ${prov("Claude (Anthropic)",claudeBad?"bad":"ok","a1b2",9)}${prov("OpenAI",openai?"ok":"none","c3d4",12)}
    <div class="sec">단계별 모델</div>
    <div class="box"><div class="field"><label>1차 분류 (싸고 빠른 모델)</label><div class="input">Claude · claude-haiku-5-5 ▾</div></div>
    <div class="field" style="margin:0"><label>카드 작성 (좋은 모델)</label><div class="input">Claude · claude-opus-5-5 ▾</div></div></div>
    <div class="box"><div class="row sb"><div><div>대체 공급자 사용</div><div class="tiny">${openai?"실패·거절 시 다른 공급자로 1회 재시도":"두 키가 모두 있어야 사용 가능"}</div></div><div class="toggle ${openai?"on":""}"></div></div></div>
    <div class="box"><div class="row sb"><div>일일 예산</div><div class="input" style="width:90px">$0.50</div></div><div class="tiny" style="margin-top:4px">넘으면 그때까지 만든 결과만 보냅니다</div></div>
    <div class="box"><div class="row sb"><div>가격표</div><span class="tiny">모델별 100만 토큰당 입력/출력 ›</span></div></div>
    <div class="box" style="opacity:.6"><div class="row sb"><div>보충 검색 <span class="pill l">L</span></div><div class="toggle"></div></div></div>
  </div>`,"settings");
};
R["SC-11b"] = s => phone(appbar("일정·메일·출처 키",{back:"SC-06"})+`<div class="scr">
  <div class="sec" style="margin-top:0">실행 일정</div>
  <div class="box"><div class="row sb"><div>매일 실행 시각</div><div class="input" style="width:80px">07:00</div></div>
  <div class="row sb" style="margin-top:8px"><div>Wi-Fi에서만</div><div class="toggle on"></div></div><div class="row sb" style="margin-top:8px"><div>충전 중에만</div><div class="toggle"></div></div>
  <div class="tiny" style="margin-top:6px">안드로이드 절전 때문에 몇십 분 늦어질 수 있습니다</div></div>
  ${s==="배터리 최적화 안내"?`<div class="box warn small">이 기기는 배터리 최적화가 켜져 있어 실행이 건너뛰어질 수 있습니다. <u>예외 허용</u></div>`:""}
  <div class="sec">메일</div>
  <div class="box"><div class="field"><label>받는 주소</label><div class="input">me@example.com</div></div><div class="field"><label>보내는 계정</label><div class="input">sender@gmail.com · 앱 비밀번호 저장됨</div></div>
  <div class="row"><button class="btn small" data-toast="테스트 메일을 보냈습니다">테스트 발송</button><span class="sp" style="flex:1"></span>메일 받기 <div class="toggle on"></div></div></div>
  <div class="sec">출처 키</div>
  <div class="box" style="padding:2px 12px"><div class="list">${[["GitHub 토큰","저장됨 ··· 9f1c"],["Reddit","없음 · 3단계"],["Product Hunt","없음 · 3단계"]].map(([n,v])=>`<div class="li"><div class="grow"><div>${n}</div><div class="tiny">${v}</div></div><span class="chev">›</span></div>`).join("")}</div></div>
  <div class="sec">백업 <span class="pill l">L</span></div><div class="row"><button class="btn small" disabled>내보내기</button><button class="btn small" disabled>가져오기</button></div></div>`,"settings");
R["SC-12"] = () => phone(appbar("정보",{back:"SC-06"})+`<div class="scr"><div class="box"><b>AI 아이디어 수집기</b><div class="tiny">버전 0.1.0</div></div>
  <div class="box"><b>오픈소스 고지</b><div class="small muted">Horizon (MIT) — 설계 참고 · OkHttp (Apache-2.0) · kotlinx.serialization (Apache-2.0) · Anthropic Java SDK · OpenAI Java SDK …</div></div></div>`,"settings");
R["MAIL"] = s => `<div class="mail"><div class="mh">보낸 사람 sender@gmail.com · 받는 사람 me@example.com<br><b style="color:var(--ink);font-size:14px">[AI 아이디어] 11월 19일 — 카드 5개 (수집 412 → 후보 18)</b></div><div class="mb">
  ${s==="출처 실패 포함"?`<div class="box warn small">⚠ Reddit 수집 실패 — 나머지 출처로 만들었습니다</div>`:""}
  <div class="small muted">수집 412 → 후보 18 → 카드 5</div>
  <div class="sec">목차</div>${CARDS.filter(c=>!c.invalid).map((c,i)=>`<div class="small">${i+1}. ${esc(c.title)} <span class="chip cat">${CATS[c.cat]}</span> ${badges(c)}</div>`).join("")}
  ${CARDS.filter(c=>!c.invalid).slice(0,2).map((c,i)=>`<div class="box" style="margin-top:12px"><div class="h">${i+1}. ${esc(c.title)}</div><div class="small muted">${esc(c.one)}</div><div class="small" style="margin-top:6px"><b>오늘 고른 이유</b> ${esc(c.why)}</div><div class="small"><b>핵심 근거</b> ${esc((c.tech[0]||c.demand[0]).t)} · ${esc((c.demand[0]||c.comp[0]||c.tech[0]).t)}</div><div class="small"><b>가장 큰 위험</b> ${esc(c.risk)}</div><div style="margin-top:6px"><u style="color:var(--accent)" data-nav="SC-02" data-card="${c.id}">앱에서 보기 ›</u></div></div>`).join("")}
  <div class="tiny" style="margin-top:6px">… 카드 3~5 같은 형식</div>
  <div class="sec">추적 업데이트</div>
  ${TRACKED.filter(t=>t.news).map(t=>`<div class="box"><div class="row sb"><b class="small">${esc(t.title)}</b><span class="small">${trendIc(t.trend)}</span></div><div class="small muted">${esc(t.ups[0].s)}</div><div style="margin-top:4px"><u style="color:var(--accent)" data-nav="SC-14" data-track="${t.id}">앱에서 보기 ›</u></div></div>`).join("")}
  <div class="tiny" style="border-top:1px solid var(--line2);margin-top:14px;padding-top:8px">오늘 비용 $0.14 · 이번 달 $2.31 (추정) · 실행 1분 05초 · HTML + 일반 텍스트 동시 발송</div></div></div>`;
R["NOTI"] = () => `<div class="noti"><div class="tiny" style="margin-bottom:8px">알림 (누르면 해당 화면으로)</div>
  <div class="n" data-nav="SC-01"><b class="small">AI 아이디어</b><div class="small">오늘의 카드 5개가 준비됐습니다 · 수집 412 → 카드 5</div></div>
  <div class="n" data-nav="SC-14" data-track="t1"><b class="small">AI 아이디어 · 추적 업데이트</b><div class="small">"로컬 LLM 회의록 앱"에 새 경쟁 제품·수요 글 3건 외 1개 아이디어</div></div>
  <div class="n" data-nav="SC-10a"><b class="small">AI 아이디어 · 실행 실패</b><div class="small">Reddit 시간 초과 · 일부 출처로 실행했습니다</div></div>
  <div class="n" data-nav="SC-11"><b class="small">AI 아이디어 · 키 확인 필요</b><div class="small">Claude 키 인증에 실패했습니다. 키를 확인해 주세요</div></div></div>`;

/* ===================== 지도·패널·이벤트 ===================== */
const notesKey = "wf-notes-v1";
let notes = {}; try{ notes = JSON.parse(localStorage.getItem(notesKey)||"{}"); }catch(e){}
function saveNotes(){ try{ localStorage.setItem(notesKey, JSON.stringify(notes)); }catch(e){} }
function renderMap(){
  const groups=[...new Set(SCREENS.map(s=>s.g))];
  document.getElementById("map").innerHTML = groups.map(g=>`<h3>${g}</h3>${SCREENS.filter(s=>s.g===g).map(s=>`<a href="#${s.id}" class="${s.id===state.screen?"on":""} ${notes[s.id]?"noted":""}" data-nav="${s.id}"><span class="id">${s.id}</span>${s.name} ${s.mvp?"":`<span class="pill l">L</span>`}${s.isNew?`<span class="pill new">새</span>`:""}<span class="dot"></span></a>`).join("")}`).join("")
   + `<h3>범례</h3><div class="tiny" style="padding:0 8px">주황 점 = 검토 메모 있음<br>샘플 데이터는 가상입니다</div>`;
}
function renderInfo(){
  const s=byId[state.screen]; const cur=curState(s.id);
  const backlinks = SCREENS.filter(x=>x.back===s.id).map(x=>x.id);
  document.getElementById("info").innerHTML = `
   <div class="sid">${s.id} · ${s.g}</div><h2>${s.name}</h2>
   <div>${s.mvp?`<span class="pill mvp">MVP</span>`:`<span class="pill l">나중(L)</span>`} ${s.isNew?`<span class="pill new">이번에 새로 정의</span>`:""}</div>
   <h4>목적</h4><div>${esc(s.purpose)}</div>
   <h4>상태 (눌러서 전환)</h4><div class="states">${s.states.map(x=>`<button class="${x===cur?"on":""}" data-setstate="${s.id}:${x}">${x}</button>`).join("")}</div>
   <h4>기능</h4><ul>${s.feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
   <h4>데이터·연동 (backend)</h4><ul>${s.data.map(f=>`<li><code>${esc(f)}</code></li>`).join("")}</ul>
   <h4>진입 경로</h4><ul>${s.entry.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
   ${s.back||backlinks.length?`<h4>연결 화면</h4><div class="navs">${s.back?`<a data-nav="${s.back}">← ${s.back} ${byId[s.back].name}</a>`:""}${backlinks.map(b=>`<a data-nav="${b}">→ ${b} ${byId[b].name}</a>`).join("")}</div>`:""}
   ${s.open.length?`<h4>미정·확인할 점</h4>${s.open.map(q=>`<div class="q">${esc(q)}</div>`).join("")}`:""}
   <h4>검토 메모 (이 브라우저에 저장)</h4><textarea id="note" placeholder="수정할 점, 빼거나 더할 기능…">${esc(notes[s.id]||"")}</textarea>
   <div class="tiny">상단 "검토 메모 복사"로 전체 메모를 마크다운으로 복사해 전달할 수 있습니다.</div>`;
  document.getElementById("note").addEventListener("input",e=>{ notes[s.id]=e.target.value; if(!e.target.value) delete notes[s.id]; saveNotes(); renderMap(); });
}
function render(){
  const s=byId[state.screen];
  document.getElementById("stage").innerHTML = R[s.id](curState(s.id));
  renderMap(); renderInfo();
  try{ history.replaceState(null,"","#"+s.id); }catch(e){}
}
let toastTimer=null, undo=null;
function closeSheet(){ state.sheet=null; const s=byId[state.screen]; if(/시트|이유 선택/.test(curState(s.id))) state.st[s.id]=s.states[0]; }
function showToast(msg, undoFn){ state.toast=msg; undo=undoFn||null; render(); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{state.toast=null;render();},2600); }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-star],[data-ni],[data-undo],[data-sheet],[data-close],[data-togglelinks],[data-setstate],[data-toast],[data-nav]");
  if(!t) return;
  if(t.dataset.star!==undefined){ e.stopPropagation(); const id=t.dataset.star; state.stars[id]=!state.stars[id]; showToast(state.stars[id]?"★ 추적을 시작했습니다 · 추적 탭에서 매일 업데이트":"추적을 멈췄습니다 · 기록은 남습니다",()=>{state.stars[id]=!state.stars[id];}); return; }
  if(t.dataset.ni){ const id=state.card||"c1"; state.notInterested[id]=t.dataset.ni; closeSheet(); showToast("관심 없음으로 표시했습니다 · 다음 날 반영",()=>{delete state.notInterested[id];}); return; }
  if(t.dataset.undo!==undefined){ if(undo) undo(); state.toast=null; render(); return; }
  if(t.dataset.sheet){ state.sheet=t.dataset.sheet; render(); return; }
  if(t.dataset.togglelinks!==undefined){ state.expandedLinks=!state.expandedLinks; render(); return; }
  if(t.dataset.close!==undefined && (e.target===t || t.tagName==="BUTTON")){ closeSheet(); render(); return; }
  if(t.dataset.toast){ const m=t.dataset.toast; if(t.dataset.closeAfter!==undefined) closeSheet(); showToast(m); return; }
  if(t.dataset.setstate){ const [id,st]=t.dataset.setstate.split(/:(.+)/); if(t.dataset.closeAfter!==undefined) closeSheet(); state.st[id]=st; if(t.dataset.nav) state.screen=t.dataset.nav; else if(id!==state.screen && !byId[state.screen].states.includes(st)) {} render(); return; }
  if(t.dataset.nav){ e.preventDefault(); if(t.dataset.card) state.card=t.dataset.card; if(t.dataset.track) state.track=t.dataset.track; state.screen=t.dataset.nav; state.sheet=null; state.expandedLinks=false; render(); document.getElementById("stage").scrollTop=0; }
});
document.getElementById("exportNotes").addEventListener("click",()=>{
  const md = "# 와이어프레임 검토 메모\n\n" + SCREENS.filter(s=>notes[s.id]).map(s=>`## ${s.id} ${s.name}\n${notes[s.id]}\n`).join("\n");
  const done = ()=>showToast(Object.keys(notes).length?"검토 메모를 복사했습니다":"아직 메모가 없습니다");
  try{ navigator.clipboard.writeText(md).then(done,done); }catch(e){ done(); }
});
const h = location.hash.slice(1); if(byId[h]) state.screen=h;
render();
</script>
